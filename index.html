<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kelimelik Asistan</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="top solver-head">
      <div class="head-row">
        <div class="head-titles">
          <h1>Kelimelik Asistan</h1>
          <p class="sub">Telefondaki oyunu buraya işleyin; en iyi hamleleri tahtada gösterir.</p>
        </div>
      </div>
    </header>

    <div class="main-layout">
      <aside class="panel actions-panel actions-rail" aria-label="İşlemler">
        <div class="toolbar-stack">
          <button type="button" id="btnLocalPreview" class="btn-run-preview btn-toolbar" title="Yerel sunucu adresinde aç (Örn. http://127.0.0.1:5500)">
            Yerel önizleme
          </button>
          <button type="button" id="btnConfirmMove" class="btn-toolbar" disabled>Seçili öneriyi onayla</button>
          <button type="button" id="btnClearPreview" class="btn-toolbar" disabled>Önizlemeyi temizle</button>
          <button type="button" id="btnSolve" class="btn-toolbar">Olası hamleleri bul</button>
          <button type="button" id="btnClearBoard" class="btn-toolbar">Tahtayı temizle</button>
          <button type="button" id="btnClearRack" class="btn-toolbar">Raftaki harfleri temizle</button>
        </div>
      </aside>

      <div class="solver-grid">
      <section class="panel moves-sidebar" aria-label="Hamle önerileri">
        <div class="moves-wrap">
          <div id="movesList"></div>
        </div>
      </section>

      <div class="board-wrap">
        <div id="board" class="board" aria-label="Tahta"></div>
        <p class="fine-print">Harfleri raf veya paletten sürükleyip tahtaya bırakın. Dolu kareyi silmek için çift tıklayın.</p>
      </div>

      <section class="panel solver-panel">
        <label>
          Elindeki harfler (en fazla 7, joker için ?)
          <input type="text" id="rackInput" placeholder="Örn: KELİM??" autocomplete="off" />
        </label>
        <div class="rack-area" aria-label="Harf rafı">
          <div id="rackTiles" class="rack-tiles" role="list"></div>
        </div>
        <div class="bank-area" aria-label="Harf paleti">
          <div id="letterBank" class="letter-bank" role="list"></div>
        </div>

        <p class="msg" id="message" role="status"></p>
      </section>
      </div>
    </div>
  </div>

  <script src="solver_rules.js"></script>
  <script src="main.js"></script>
</body>
</html>
